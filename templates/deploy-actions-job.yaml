apiVersion: batch/v1
kind: Job
metadata:
  name: deploy-actions
  namespace: openwhisk
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: deploy-actions
        image: {{ .Values.jobs.deployActions.image }}
        imagePullPolicy: {{.Values.global.imagePullPolicy}}
        env:
        - name: WSK_API_HOST
          value: {{ .Values.global.openwhisk.apiHost }}
        - name: WSK_AUTH_KEY
          value: {{ .Values.global.openwhisk.authKey }}
        - name: REDIS_HOST
          value: {{ .Values.global.redis.host }}
        - name: REDIS_PORT
          value: "{{ .Values.global.redis.port }}"
        - name: REDIS_DB
          value: "{{ .Values.global.redis.db }}"
        command: ["/bin/bash", "-c"]
        args:
        - |
          /app/deploy_ow_actions.sh
      restartPolicy: Never
  backoffLimit: 4
